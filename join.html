<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Get the app · HuddleShift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0A0A0A;
    color: #FFFFFF;
    font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }

  .page {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    left: 50%;
    top: 38%;
    width: min(900px, 140vw);
    height: min(600px, 90vh);
    transform: translate(-50%, -50%);
    background: radial-gradient(50% 50% at 50% 50%, rgba(0,255,255,0.10) 0%, rgba(10,10,10,0) 70%);
    pointer-events: none;
  }

  header {
    position: relative;
    height: 70px;
    padding: 0 32px;
    display: flex;
    align-items: center;
    max-width: 1320px;
    width: 100%;
    margin: 0 auto;
  }
  header img { height: 24px; width: auto; display: block; }

  main {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px calc(64px + env(safe-area-inset-bottom));
  }
  .eyebrow {
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.2em;
    color: #8A8A8A;
  }
  h1 {
    margin: 28px 0 0;
    max-width: 760px;
    font-size: clamp(40px, 6.4vw, 84px);
    line-height: 0.96;
    letter-spacing: -0.045em;
    font-weight: 700;
    text-wrap: balance;
  }
  p {
    margin: clamp(18px, 2vw, 28px) 0 0;
    max-width: 440px;
    font-size: clamp(16px, 1.5vw, 19px);
    line-height: 1.55;
    color: #A8A8A8;
    text-wrap: pretty;
  }
  .stores {
    margin-top: clamp(32px, 3.4vw, 48px);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    align-items: center;
  }
  .stores a {
    display: block;
    line-height: 0;
    border-radius: 10px;
    filter: drop-shadow(0 4px 18px rgba(0,0,0,0.55));
    transition: transform 200ms cubic-bezier(.16,1,.3,1), opacity 200ms;
  }
  .stores a:hover { transform: translateY(-2px); opacity: 0.9; }
  .stores a:focus-visible { outline: 2px solid #00FFFF; outline-offset: 4px; }
  .stores img { height: 56px; width: auto; display: block; }
  .note {
    margin-top: 22px;
    font-size: 13.5px;
    color: #8A8A8A;
  }

  @media (max-width: 480px) {
    header { padding: 0 20px; }
    .stores { flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) {
    .stores a { transition: none; }
  }
</style>

</head>
<body>

<div class="page">
  <div class="glow"></div>

  <header>
    <a href="index.html" aria-label="HuddleShift home"><img src="assets/logo-huddleshift.png" alt="HuddleShift"></a>
  </header>

  <main>
    <div class="eyebrow">GET THE APP</div>
    <h1>Don't have the app?</h1>
    <p>Download HuddleShift to continue.</p>

    <div class="stores">
      <a href="https://apps.apple.com/us/app/huddle-shift-staff-planner/id6785232071" aria-label="Download on the App Store" onclick="posthog.capture('appstore_clicked', { location: 'get_app' })">

        <img src="assets/googleplay-logo.svg" alt="Get it on Google Play">
      </a>
    </div>

    <div class="note">Free for teams up to 10 employees.</div>
  </main>
</div>

</html>
