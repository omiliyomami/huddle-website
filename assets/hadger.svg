<svg xmlns="http://www.w3.org/2000/svg" viewBox="340 56 845 860" width="1690" height="1720">
  <defs>
    <radialGradient id="shell" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#eef0f6"/>
      <stop offset="1" stop-color="#d4d8e4"/>
    </radialGradient>
    <radialGradient id="visor" cx="45%" cy="25%" r="80%">
      <stop offset="0" stop-color="#2a2d33"/>
      <stop offset="0.6" stop-color="#131518"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </radialGradient>
    <linearGradient id="visorShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#8ff3ff"/>
      <stop offset="0.5" stop-color="#2fd3ee"/>
      <stop offset="1" stop-color="#0aa6c8"/>
    </radialGradient>
    <linearGradient id="earCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1fc9e8"/>
      <stop offset="1" stop-color="#4fe0f7"/>
    </linearGradient>
    <radialGradient id="earDark" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#4a4f57"/>
      <stop offset="1" stop-color="#1c1f24"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>


  <!-- Antenna -->
  <path d="M868 245 L888 195" stroke="#2b3038" stroke-width="26" stroke-linecap="round"/>
  <circle cx="912" cy="140" r="74" fill="url(#ball)"/>
  <ellipse cx="885" cy="108" rx="22" ry="14" fill="#ffffff" opacity="0.7" transform="rotate(-30 885 108)"/>

  <!-- Ears -->
  <g>
    <path d="M470 432 L430 432 C380 440 352 500 352 568 C352 636 380 696 430 704 L470 704 Z" fill="url(#earCyan)"/>
    <ellipse cx="392" cy="568" rx="36" ry="100" fill="url(#earDark)"/>
  </g>
  <g>
    <path d="M1052 436 L1092 436 C1142 444 1172 504 1172 572 C1172 640 1142 700 1092 708 L1052 708 Z" fill="url(#earCyan)"/>
    <ellipse cx="1134" cy="572" rx="36" ry="100" fill="url(#earDark)"/>
  </g>

  <!-- Head shell -->
  <ellipse cx="762" cy="568" rx="340" ry="336" fill="url(#shell)"/>

  <!-- Visor -->
  <path d="M760 326
           C960 326 1042 352 1046 540
           C1050 720 990 790 760 790
           C530 790 466 720 468 540
           C470 352 560 326 760 326 Z" fill="url(#visor)"/>
  <path d="M760 340 C930 340 1010 362 1022 440 C900 400 620 400 494 440 C506 362 590 340 760 340 Z"
        fill="url(#visorShine)"/>

  <!-- Face -->
  <g fill="none" stroke="#2fe8ff" stroke-width="34" stroke-linecap="round" filter="url(#glow)">
    <path d="M532 578 C545 520 640 495 668 578"/>
    <path d="M836 578 C850 520 950 495 970 598"/>
    <path d="M692 634 C720 672 780 672 802 634"/>
  </g>
</svg>
