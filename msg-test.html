<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>HuddleShift – Bridge Test</title>
  <style>
    :root {
      --bg: #0A0A0A;
      --card: #141414;
      --border: rgba(255, 255, 255, 0.08);
      --text: #FFFFFF;
      --muted: rgba(255, 255, 255, 0.55);
      --accent: rgb(111, 243, 234);
      --danger: #FF5C5C;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); color: var(--text); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
      max-width: 520px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }

    .logo { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 28px; }
    .logo span { color: var(--accent); }

    .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; }
    h1 { font-size: clamp(30px, 9vw, 40px); font-weight: 800; letter-spacing: -1px; line-height: 1.1; margin: 8px 0 12px; }
    h1 em { font-style: normal; color: var(--accent); }
    p.lead { color: var(--muted); font-size: 16px; line-height: 1.5; margin-bottom: 20px; }

    .status {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--card);
      font-size: 13px; font-weight: 600; margin-bottom: 24px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
    .status.ok .dot { background: var(--accent); }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; padding: 18px; margin-bottom: 16px;
    }
    .card h2 { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 340px) { .grid { grid-template-columns: 1fr; } }

    button, input {
      font: inherit; font-size: 15px; font-weight: 600;
      border-radius: 999px; padding: 13px 16px; width: 100%;
    }
    button { cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--text); transition: transform .08s, opacity .15s; }
    button:active { transform: scale(0.97); opacity: .8; }
    button.primary { background: var(--accent); color: #000; border-color: var(--accent); }
    button.danger { border-color: rgba(255, 92, 92, .4); color: var(--danger); }
    .full { grid-column: 1 / -1; }

    input {
      background: #0A0A0A; color: var(--text); border: 1px solid var(--border);
      font-weight: 500; margin-bottom: 10px; outline: none;
    }
    input:focus { border-color: var(--accent); }

    #log {
      font-family: ui-monospace, Menlo, monospace; font-size: 12px; line-height: 1.5;
      max-height: 200px; overflow-y: auto; color: var(--muted);
      white-space: pre-wrap; word-break: break-word;
    }
    #log .out { color: var(--accent); }
    #log .in { color: #FFD66B; }
    #log .err { color: var(--danger); }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .row h2 { margin: 0; }
    .link { background: none; border: none; color: var(--muted); font-size: 13px; padding: 0; width: auto; }
  </style>
</head>
<body>
  <div class="logo">Huddle<span>Shift</span></div>

  <div class="eyebrow">Bridge test</div>
  <h1>Talk to the <em>app</em></h1>
  <p class="lead">Each button sends a message to the React Native app through the WebView bridge.</p>

  <div id="status" class="status"><span class="dot"></span><span id="statusText">Checking…</span></div>

  <div class="card">
    <h2>Actions</h2>
    <div class="grid">
      <button class="primary full" onclick="send({ type: 'navigate', screen: '/paywall' })">Upgrade to Pro</button>
      <button onclick="send({ type: 'navigate', screen: '/(app)/(home)' })">Go home</button>
      <button onclick="send({ type: 'openUrl', url: 'https://apps.apple.com/us/app/huddle-shift-staff-planner/id6785232071' })">App Store</button>
      <button onclick="send({ type: 'toast', title: 'Hello', message: 'Sent from the WebView' })">Show toast</button>
      <button onclick="send({ type: 'haptic' })">Haptic</button>
      <button class="danger full" onclick="send({ type: 'close' })">Close popup</button>
    </div>
  </div>

  <div class="card">
    <h2>Custom message</h2>
    <input id="custom" placeholder='{"type":"ping"}' value='{"type":"ping"}' />
    <button onclick="sendCustom()">Send JSON</button>
  </div>

  <div class="card">
    <div class="row">
      <h2>Log</h2>
      <button class="link" onclick="document.getElementById('log').innerHTML=''">Clear</button>
    </div>
    <div id="log"></div>
  </div>

  <script>
    const logEl = document.getElementById('log');
    const inApp = () => !!window.ReactNativeWebView;

    function log(text, cls) {
      const line = document.createElement('div');
      line.className = cls || '';
      line.textContent = new Date().toLocaleTimeString() + '  ' + text;
      logEl.prepend(line);
    }

    // Web → App
    function send(msg) {
      if (!inApp()) {
        log('✕ Not inside the app: ' + JSON.stringify(msg), 'err');
        return;
      }
      window.ReactNativeWebView.postMessage(JSON.stringify(msg));
      log('→ ' + JSON.stringify(msg), 'out');
    }

    function sendCustom() {
      try {
        send(JSON.parse(document.getElementById('custom').value));
      } catch (e) {
        log('✕ Invalid JSON', 'err');
      }
    }

    // App → Web: the app calls window.onAppMessage({...}) via injectJavaScript
    window.onAppMessage = function (msg) {
      log('← ' + JSON.stringify(msg), 'in');
    };

    function updateStatus() {
      const el = document.getElementById('status');
      document.getElementById('statusText').textContent = inApp() ? 'Connected to app' : 'Not in app (browser)';
      el.classList.toggle('ok', inApp());
    }
    updateStatus();
    // The bridge object can be injected slightly after load
    setTimeout(updateStatus, 300);

    if (inApp()) send({ type: 'ready' });
  </script>
</body>
</html>
